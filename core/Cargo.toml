[package]
name = "vindex-core"
version = "1.0.0"
edition = "2021"
description = "Motor do Vindex: diagnóstico de hardware, limpeza, organização de arquivos e regras."

[dependencies]
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
starship-battery = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
