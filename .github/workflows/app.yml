name: App (interface, Windows e APK)

# Tudo roda em máquina Windows do GitHub (as máquinas Linux estavam sem vaga). O Linux fica em workflow separado, para depois.
# Verifica a interface, gera o instalador do Windows (Tauri) e o APK do Android (Capacitor + plugin Kotlin).
# Cada versão boa vira uma release "1.N" com VindexSetup.exe e Vindex.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}

  windows:
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
        env:
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: vindex-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: verificar
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Testar o motor do Android (sem o Android)
        run: |
          curl -fsSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p saida
          javac -cp json.jar -d saida android/src/Motor.java android/teste/MotorTeste.java
          java -cp "json.jar;saida" tech.vetorial.vindex.MotorTeste
      - name: Preparar o projeto Android
        working-directory: app
        run: |
          npm run build
          npx cap add android
          D=android/app/src/main/java/tech/vetorial/vindex
          mkdir -p $D
          cp ../android/src/*.java $D/
          # descompactar e compactar dentro do app: ZIP, 7z, RAR, TAR, GZ, BZ2, XZ
          sed -i "0,/dependencies {/s#dependencies {#dependencies {\n    implementation 'org.apache.commons:commons-compress:1.26.2'\n    implementation 'org.tukaani:xz:1.9'\n    implementation 'com.github.junrar:junrar:7.5.5'#" android/app/build.gradle
          grep -n "commons-compress\|junrar" android/app/build.gradle
          # permissões: arquivos (liberada pela pessoa), leitura do aparelho, rede, apps instalados, encerrar apps em segundo plano e instalar a própria atualização
          PERMS='<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" xmlns:tools="http://schemas.android.com/tools" tools:ignore="ProtectedPermissions" />'
          sed -i "s#<application#$PERMS\n    <application#" android/app/src/main/AndroidManifest.xml
          # o Vindex aparece como opção para "abrir downloads" e "abrir pasta" de qualquer app
          FILTROS='<intent-filter>\n                <action android:name="android.intent.action.VIEW_DOWNLOADS" />\n                <category android:name="android.intent.category.DEFAULT" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="vnd.android.document/directory" />\n            </intent-filter>'
          sed -i "0,/<\/activity>/s#</activity>#$FILTROS\n        </activity>#" android/app/src/main/AndroidManifest.xml
          grep -c "VIEW_DOWNLOADS" android/app/src/main/AndroidManifest.xml
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml
          # abrir arquivos de qualquer pasta com o app padrão (o Capacitor já declara o FileProvider ".fileprovider"; aqui liberamos os caminhos)
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths xmlns:android="http://schemas.android.com/apk/res/android">' '    <root-path name="raiz" path="." />' '    <cache-path name="cache" path="." />' '</paths>' > android/app/src/main/res/xml/file_paths.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#070B14' --iconBackgroundColorDark '#070B14' --splashBackgroundColor '#070B14' --splashBackgroundColorDark '#070B14'
          npx cap sync android
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior.
      - name: Assinar o APK
        run: bash .github/assinar-apk.sh app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vindex-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [windows, android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vindex-windows
          path: pacote
      - uses: actions/download-artifact@v4
        with:
          name: vindex-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/Vindex.apk
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VindexSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/Vindex.apk pacote/VindexSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vindex 1.${{ github.run_number }}" --notes "Vindex.apk (Android) e VindexSetup.exe (Windows)."
