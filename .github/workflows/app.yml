name: App (interface, Windows e APK)

# Verifica a interface, gera o instalador do Windows (Tauri) e o APK do Android (Capacitor + plugin Kotlin).
# Cada versão boa vira uma release "1.N" com VindexSetup.exe e Vindex.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}

  windows:
    needs: verificar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
        env:
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: vindex-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Testar o motor do Android (sem o Android)
        run: |
          curl -fsSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p saida
          javac -cp json.jar -d saida android/src/Motor.java android/teste/MotorTeste.java
          java -cp json.jar:saida tech.vetorial.vindex.MotorTeste
      - name: Preparar o projeto Android
        working-directory: app
        run: |
          npm run build
          npx cap add android
          D=android/app/src/main/java/tech/vetorial/vindex
          mkdir -p $D
          cp ../android/src/Motor.java ../android/src/VindexPlugin.java $D/
          cat > $D/MainActivity.java <<'JAVA'
          package tech.vetorial.vindex;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(VindexPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          # permissão de arquivos (acesso a todos os arquivos, liberado pelo usuário nas configurações)
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#070B14' --iconBackgroundColorDark '#070B14' --splashBackgroundColor '#070B14' --splashBackgroundColorDark '#070B14'
          npx cap sync android
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vindex-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vindex-windows
          path: pacote
      - uses: actions/download-artifact@v4
        with:
          name: vindex-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/Vindex.apk
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VindexSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/Vindex.apk pacote/VindexSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vindex 1.${{ github.run_number }}" --notes "Vindex.apk (Android) e VindexSetup.exe (Windows)."
